services:
  - type: web
    name: nexcent
    runtime: node
    plan: free
    buildCommand: npm ci && npm ci --prefix backend && npm ci --include=dev --prefix frontend && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MANAGER_EMAIL
        sync: false
      - key: MANAGER_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
